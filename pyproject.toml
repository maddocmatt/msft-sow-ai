[project]
name = "msft-sow-ai"
version = "0.1.0"
description = "Agentic system on Azure that generates SQA-passing SOWs, BEs, WBSs, and collateral for Microsoft Services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Wilson" }]

dependencies = [
    "pydantic>=2.7",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "azure-cosmos>=4.7",
    "azure-search-documents>=11.5",
    "azure-ai-projects>=1.0.0b5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "UP",         # pyupgrade
    "S",          # bandit-lite (security)
    "C4",         # comprehensions
    "SIM",        # simplify
    "TID",        # tidy imports
    "RUF",
]
ignore = [
    "S101",       # asserts allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Mypy — strict
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
mypy_path = "src:function_app"
namespace_packages = true
explicit_package_bases = true
exclude = "function_app/(shared|sqa|rubrics|templates|\\.python_packages)/"

[[tool.mypy.overrides]]
module = ["azure.*", "openpyxl.*", "docx.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest + coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ----------------------------------------------------------------------------
# Bandit — security scan (run on src only)
# ----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]  # assert_used (tests handle their own)
